<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#0c0b0a}svg{display:block}</style></head><body>
<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="sky" cx="28%" cy="32%" r="90%"><stop offset="0" stop-color="#33291f"/><stop offset=".5" stop-color="#17140f"/><stop offset="1" stop-color="#0a0908"/></radialGradient>
  <radialGradient id="planet" cx="50%" cy="0%" r="55%"><stop offset="0" stop-color="#46372448"/><stop offset="0" stop-color="#3f3122"/><stop offset=".3" stop-color="#211a13"/><stop offset="1" stop-color="#0c0b09"/></radialGradient>
  <filter id="terrain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.006 0.02" numOctaves="4" seed="3"/><feColorMatrix values="0 0 0 0 .55 0 0 0 0 .42 0 0 0 0 .26 0 0 0 .35 -.08"/><feComposite in2="SourceGraphic" operator="in"/></filter>
  <linearGradient id="rimfade" x1="0" x2="1"><stop offset="0" stop-color="#e8bd6a" stop-opacity="0"/><stop offset=".18" stop-color="#e8bd6a" stop-opacity=".95"/><stop offset=".82" stop-color="#e8bd6a" stop-opacity=".95"/><stop offset="1" stop-color="#e8bd6a" stop-opacity="0"/></linearGradient>
  <radialGradient id="haze" cx="50%" cy="100%" r="60%"><stop offset=".7" stop-color="#e8a85a" stop-opacity=".14"/><stop offset="1" stop-color="#e8a85a" stop-opacity="0"/></radialGradient>
  <linearGradient id="titlefill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6d58f"/><stop offset="1" stop-color="#d9a24e"/></linearGradient>
  <radialGradient id="moon" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#d9d2c2"/><stop offset="1" stop-color="#6d665a"/></radialGradient>
  <filter id="glow" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="8"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="2.5"/></filter>
  <filter id="tglow" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
</defs>
<rect width="1280" height="720" fill="url(#sky)"/>
<g id="stars"></g>
<circle cx="1232" cy="84" r="15" fill="url(#moon)" opacity=".8"/>
<circle cx="1237" cy="80" r="13" fill="#151210" opacity=".55"/>

<circle cx="640" cy="1700" r="1185" fill="url(#haze)"/>
<circle cx="640" cy="1700" r="1160" fill="url(#planet)"/>
<circle cx="640" cy="1700" r="1160" fill="#3a2d1f" filter="url(#terrain)"/>
<circle cx="640" cy="1700" r="1160" fill="none" stroke="url(#rimfade)" stroke-width="16" filter="url(#glow)" opacity=".75"/>
<circle cx="640" cy="1700" r="1160" fill="none" stroke="url(#rimfade)" stroke-width="2.5"/>
<g id="timeline"></g>
<g id="web"></g>

<g font-family="Bitstream Charter, Georgia, serif">
  <text x="88" y="262" font-size="128" font-weight="700" fill="#e8b866" opacity=".35" filter="url(#tglow)">Rimlore</text>
  <text x="88" y="262" font-size="128" font-weight="700" fill="url(#titlefill)" letter-spacing="2">Rimlore</text>
  <text x="92" y="318" font-size="31" font-style="italic" fill="#efe6d3">Every colony has a story.</text>
  <text x="92" y="358" font-size="31" font-style="italic" fill="#efe6d3">Rimlore writes it down.</text>
</g>
<script>
const NS="http://www.w3.org/2000/svg";
const el=(t,a,p,txt)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;p.appendChild(e);return e;};

// stars: small field plus a few bright twinkles
let seed=11; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const S=document.getElementById("stars");
for(let i=0;i<190;i++){const x=rnd()*1280,y=rnd()*500;if(x>70&&x<600&&y>120&&y<420)continue;el("circle",{cx:x,cy:y,r:(rnd()*1.1+.3).toFixed(2),fill:"#f3e7cc",opacity:(.2+rnd()*.6).toFixed(2)},S);}
[[560,70],[820,150],[1240,300],[40,520],[700,420]].forEach(([x,y])=>{
  el("path",{d:`M${x-7} ${y} H${x+7} M${x} ${y-7} V${y+7}`,stroke:"#fbefd6","stroke-width":1.2,opacity:.8},S);
  el("circle",{cx:x,cy:y,r:1.8,fill:"#fff"},S);});

// timeline along the rim
const CX=640,CY=1700,R=1160, T=document.getElementById("timeline");
const at=t=>{const a=-Math.PI/2+t;return [CX+R*Math.cos(a),CY+R*Math.sin(a)];};
const moments=[["Founded","#7dcf86"],["First raid","#e57368"],["Biscuit tamed","#7dcf86"],["Mira & Jun wed","#e8b866"],["Rook lost","#e57368"],["Converted","#c6a3ee"],["Born: Ember","#7dcf86"]];
const n=moments.length;
// year ticks between moments
[["5500",-0.35],["5501",-0.07],["5502",0.21]].forEach(([y,t])=>{const [x,yy]=at(t);
  el("path",{d:`M${x} ${yy-5} V${yy+9}`,stroke:"#e8bd6a","stroke-opacity":.6,"stroke-width":1.5},T);
  el("text",{x,y:yy+30,"text-anchor":"middle","font-family":"Inter, sans-serif","font-size":13,"font-weight":600,"letter-spacing":1.5,fill:"#8f8169"},T,y);});
moments.forEach(([label,color],i)=>{
  const t=-0.42+i*(0.84/(n-1)), [x,y]=at(t), stem=i%2?60:28;
  el("circle",{cx:x,cy:y,r:14,fill:color,opacity:.3,filter:"url(#soft)"},T);
  el("line",{x1:x,y1:y-11,x2:x,y2:y-stem,stroke:color,"stroke-opacity":.55,"stroke-width":1.5},T);
  el("circle",{cx:x,cy:y,r:7,fill:color,stroke:"#0f0d0b","stroke-width":2.5},T);
  el("text",{x,y:y-stem-10,"text-anchor":"middle","font-family":"Inter, sans-serif","font-size":17,"font-weight":500,fill:"#e2d8c3"},T,label);
});

// relationship constellation
const W=document.getElementById("web");
const N={M:[905,170,"Mira"],J:[1065,250,"Jun"],R:[860,345,"Rook"],B:[1120,105,"Biscuit"],E:[1110,395,"Ember"]};
const link=(a,b,color,dash,icon)=>{const [x1,y1]=N[a],[x2,y2]=N[b];
  el("line",{x1,y1,x2,y2,stroke:color,"stroke-width":2,"stroke-opacity":.6,"stroke-dasharray":dash||""},W);
  if(icon){const mx=(x1+x2)/2,my=(y1+y2)/2; el("circle",{cx:mx,cy:my,r:13,fill:"#14110e",stroke:color,"stroke-opacity":.6},W);
    el("text",{x:mx,y:my+6,"text-anchor":"middle","font-size":16,fill:color},W,icon);}};
link("M","J","#e8b866","", "♥");
link("M","E","#8db8f0","4 6"); link("J","E","#8db8f0","4 6");
link("J","B","#7dcf86","2 6");
link("M","R","#e57368","7 6"); link("R","J","#7dcf86","7 6");
const bust=(x,y,s,c)=>{el("circle",{cx:x,cy:y-6*s,r:7*s,fill:c},W);el("path",{d:`M${x-12*s} ${y+12*s} Q${x-11*s} ${y+2*s} ${x} ${y+2*s} Q${x+11*s} ${y+2*s} ${x+12*s} ${y+12*s} Z`,fill:c},W);};
const paw=(x,y,c)=>{el("ellipse",{cx:x,cy:y+5,rx:7,ry:6,fill:c},W);[[-8,-3],[-3,-9],[3,-9],[8,-3]].forEach(([dx,dy])=>el("circle",{cx:x+dx,cy:y+dy,r:2.8,fill:c},W));};
for(const [k,[x,y,name]] of Object.entries(N)){
  const lost=k==="R", gold=lost?"#8a8172":"#e8b866";
  if(!lost) el("circle",{cx:x,cy:y,r:36,fill:"#e8b866",opacity:.16,filter:"url(#soft)"},W);
  el("circle",{cx:x,cy:y,r:26,fill:"#1d1813",stroke:gold,"stroke-width":2,"stroke-dasharray":lost?"3 4":""},W);
  if(k==="B") paw(x,y,gold); else bust(x,y+2,k==="E"?0.75:1,gold);
  el("text",{x,y:y+50,"text-anchor":"middle","font-family":"Inter, sans-serif","font-size":15,"font-weight":500,fill:lost?"#857b6b":"#c9bea7"},W,lost?"Rook †":name);
}
</script>
</svg></body></html>
